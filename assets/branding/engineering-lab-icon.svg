<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 220 220"
  role="img"
  aria-labelledby="engineering-lab-emblem-title engineering-lab-emblem-description"
  id="engineering-lab-emblem"
  data-theme="auto">

  <title id="engineering-lab-emblem-title">The Engineering Lab emblem</title>
  <desc id="engineering-lab-emblem-description">
    A geometric EL monogram inside a structural frame, joined by
    computing circuit paths and a scientific orbital element.
  </desc>

  <style>
    /*
     * Engineering Lab semantic brand colours.
     * Dark is the default, as specified in DESIGN-SYSTEM.md.
     * The SVG has no baked-in background.
     */

    #engineering-lab-emblem {
      --el-ink: #E8EEF5;
      --el-muted: #94A3B8;
      --el-outline: #334155;
      --el-accent: #2F80FF;
    }

    @media (prefers-color-scheme: light) {
      #engineering-lab-emblem:not([data-theme="dark"]) {
        --el-ink: #0F172A;
        --el-muted: #475569;
        --el-outline: #E2E8F0;
        --el-accent: #2563EB;
      }
    }

    #engineering-lab-emblem[data-theme="dark"] {
      --el-ink: #E8EEF5;
      --el-muted: #94A3B8;
      --el-outline: #334155;
      --el-accent: #2F80FF;
    }

    #engineering-lab-emblem[data-theme="light"] {
      --el-ink: #0F172A;
      --el-muted: #475569;
      --el-outline: #E2E8F0;
      --el-accent: #2563EB;
    }

    .frame {
      fill: none;
      stroke: var(--el-outline);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .structure {
      fill: none;
      stroke: var(--el-ink);
      stroke-width: 5;
      stroke-linecap: square;
      stroke-linejoin: bevel;
    }

    .circuit {
      fill: none;
      stroke: var(--el-accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node {
      fill: var(--el-accent);
    }
  </style>

  <!-- The emblem is centred in a square canvas for icon use. -->
  <g id="emblem" transform="translate(9 7)">

    <!-- Outer structural frame -->
    <path class="frame" d="
      M 102 15
      L 179 59
      L 179 147
      L 102 191
      L 25 147
      L 25 59
      Z
    "/>

    <!-- Inner structural frame -->
    <path class="frame" d="
      M 102 29
      L 165 65
      L 165 139
      L 102 175
      L 39 139
      L 39 65
      Z
    "/>

    <!-- E monogram: vertical spine and three precision arms -->
    <path class="structure" d="
      M 76 65
      L 76 143
      L 119 143
      M 76 104
      L 110 104
      M 76 65
      L 119 65
    "/>

    <!-- L monogram -->
    <path class="structure" d="
      M 132 104
      L 132 143
      L 157 143
    "/>

    <!-- Computing circuit paths -->
    <path class="circuit" d="
      M 76 65 L 57 46
      M 119 65 L 145 46
      M 132 104 L 155 85
      M 76 143 L 54 163
      M 132 143 L 151 163
    "/>

    <!-- Circuit endpoints -->
    <circle class="node" cx="57" cy="46" r="4"/>
    <circle class="node" cx="145" cy="46" r="4"/>
    <circle class="node" cx="155" cy="85" r="4"/>
    <circle class="node" cx="54" cy="163" r="4"/>
    <circle class="node" cx="151" cy="163" r="4"/>

    <!-- Scientific orbital element -->
    <ellipse
      cx="102"
      cy="104"
      rx="84"
      ry="34"
      transform="rotate(-32 102 104)"
      fill="none"
      stroke="var(--el-accent)"
      stroke-width="1.8"
      opacity="0.8"
    />

    <!-- Central reference point -->
    <circle cx="102" cy="104" r="6" class="node"/>
    <circle
      cx="102"
      cy="104"
      r="12"
      fill="none"
      stroke="var(--el-accent)"
      stroke-width="1"
      opacity="0.55"
    />
  </g>
</svg>
