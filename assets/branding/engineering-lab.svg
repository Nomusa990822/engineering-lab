<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 220"
  role="img"
  aria-labelledby="logo-title logo-description"
  id="engineering-lab-logo"
  data-theme="auto">

  <title id="logo-title">The Engineering Lab</title>
  <desc id="logo-description">
    A custom geometric EL emblem combining structural engineering,
    computing circuit connections, and a scientific orbital element.
  </desc>

  <style>
    /*
     * Engineering Lab brand tokens.
     * Default theme is dark, matching DESIGN-SYSTEM.md.
     * The SVG remains transparent so it works on themed surfaces.
     */

    #engineering-lab-logo {
      --el-ink: #E8EEF5;
      --el-muted: #94A3B8;
      --el-outline: #334155;
      --el-accent: #2F80FF;
    }

    /* Follow the operating-system preference when no explicit theme is set. */
    @media (prefers-color-scheme: light) {
      #engineering-lab-logo:not([data-theme="dark"]) {
        --el-ink: #0F172A;
        --el-muted: #475569;
        --el-outline: #E2E8F0;
        --el-accent: #2563EB;
      }
    }

    /* Explicit theme overrides for inline SVG use. */
    #engineering-lab-logo[data-theme="dark"] {
      --el-ink: #E8EEF5;
      --el-muted: #94A3B8;
      --el-outline: #334155;
      --el-accent: #2F80FF;
    }

    #engineering-lab-logo[data-theme="light"] {
      --el-ink: #0F172A;
      --el-muted: #475569;
      --el-outline: #E2E8F0;
      --el-accent: #2563EB;
    }

    .frame {
      fill: none;
      stroke: var(--el-outline);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .structure {
      fill: none;
      stroke: var(--el-ink);
      stroke-width: 5;
      stroke-linecap: square;
      stroke-linejoin: bevel;
    }

    .circuit {
      fill: none;
      stroke: var(--el-accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node {
      fill: var(--el-accent);
    }

    .wordmark {
      fill: var(--el-ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .subtitle {
      fill: var(--el-muted);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 2.2px;
    }
  </style>

  <!-- HYBRID EMBLEM: structural frame, EL monogram, circuits and orbit -->
  <g id="emblem" transform="translate(10 10)">

    <!-- Outer engineered frame -->
    <path class="frame" d="
      M 102 15
      L 179 59
      L 179 147
      L 102 191
      L 25 147
      L 25 59
      Z
    "/>

    <!-- Inner frame -->
    <path class="frame" d="
      M 102 29
      L 165 65
      L 165 139
      L 102 175
      L 39 139
      L 39 65
      Z
    "/>

    <!-- E: precision-built vertical spine and three arms -->
    <path class="structure" d="
      M 76 65
      L 76 143
      L 119 143
      M 76 104
      L 110 104
      M 76 65
      L 119 65
    "/>

    <!-- L: shared visual language and aligned baseline -->
    <path class="structure" d="
      M 132 104
      L 132 143
      L 157 143
    "/>

    <!-- Circuit paths extending from the monogram -->
    <path class="circuit" d="
      M 76 65 L 57 46
      M 119 65 L 145 46
      M 132 104 L 155 85
      M 76 143 L 54 163
      M 132 143 L 151 163
    "/>

    <!-- Circuit endpoints -->
    <circle class="node" cx="57" cy="46" r="4"/>
    <circle class="node" cx="145" cy="46" r="4"/>
    <circle class="node" cx="155" cy="85" r="4"/>
    <circle class="node" cx="54" cy="163" r="4"/>
    <circle class="node" cx="151" cy="163" r="4"/>

    <!-- Scientific orbital element -->
    <ellipse
      cx="102"
      cy="104"
      rx="84"
      ry="34"
      transform="rotate(-32 102 104)"
      fill="none"
      stroke="var(--el-accent)"
      stroke-width="1.8"
      opacity="0.8"
    />

    <!-- Central reference point -->
    <circle cx="102" cy="104" r="6" class="node"/>
    <circle
      cx="102"
      cy="104"
      r="12"
      fill="none"
      stroke="var(--el-accent)"
      stroke-width="1"
      opacity="0.55"
    />
  </g>

  <!-- WORDMARK -->
  <g id="wordmark">
    <text class="wordmark" x="225" y="102" font-size="35">
      ENGINEERING
    </text>

    <text
      x="225"
      y="148"
      font-family="Inter, 'Segoe UI', Arial, sans-serif"
      font-size="39"
      font-weight="700"
      letter-spacing="8"
      fill="var(--el-accent)">
      LAB
    </text>

    <path
      d="M 225 167 H 540"
      stroke="var(--el-outline)"
      stroke-width="1"
    />

    <text class="subtitle" x="225" y="190" font-size="10">
      ENGINEERING · COMPUTING · SCIENCE
    </text>
  </g>
</svg>
