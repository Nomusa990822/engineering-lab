<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 240"
  role="img"
  aria-labelledby="engineering-lab-monogram-title engineering-lab-monogram-description"
  id="engineering-lab-monogram"
  data-theme="auto">

  <title id="engineering-lab-monogram-title">Engineering Lab — Interlocked EL Monogram</title>
  <desc id="engineering-lab-monogram-description">
    An original geometric EL monogram. A squared E is nested within an open L-shaped
    outer stroke. Both letterforms use one consistent colour.
  </desc>

  <style>
    /*
     * One-colour interlocked EL mark.
     * Dark and light use the Engineering Lab blue accent.
     * Set data-variant="inverse" for a white mark on a blue surface.
     */
    #engineering-lab-monogram {
      --el-mark: #2F80FF;
    }

    @media (prefers-color-scheme: light) {
      #engineering-lab-monogram:not([data-theme="dark"]) {
        --el-mark: #2563EB;
      }
    }

    #engineering-lab-monogram[data-theme="dark"] {
      --el-mark: #2F80FF;
    }

    #engineering-lab-monogram[data-theme="light"] {
      --el-mark: #2563EB;
    }

    #engineering-lab-monogram[data-variant="inverse"] {
      --el-mark: #FFFFFF;
    }

    .monogram {
      fill: none;
      stroke: var(--el-mark);
      stroke-width: 17;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      stroke-miterlimit: 4;
    }
  </style>

  <!-- E: one vertical spine with three squared horizontal arms. -->
  <path class="monogram" d="
    M 82 42 H 190
    M 82 42 V 198
    M 82 120 H 158
    M 82 198 H 190
  "/>

  <!-- L: an independent outer stroke with a chamfered upper terminal. -->
  <path class="monogram" d="
    M 64 66
    L 46 84
    V 218
    H 190
  "/>
</svg>
