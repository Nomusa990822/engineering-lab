<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 160 160"
  role="img"
  aria-labelledby="engineering-lab-monogram-title engineering-lab-monogram-description"
  id="engineering-lab-monogram"
  data-theme="auto">

  <title id="engineering-lab-monogram-title">Engineering Lab — EL Monogram</title>
  <desc id="engineering-lab-monogram-description">
    A minimal geometric monogram formed from the letters E and L.
    The E uses the primary ink colour and the L uses the Engineering Lab blue accent.
  </desc>

  <style>
    /*
     * Minimal EL monogram.
     * No frame, orbit, nodes, gradients or decorative paths.
     * Dark is the default; explicit data-theme values override it.
     */
    #engineering-lab-monogram {
      --el-ink: #E8EEF5;
      --el-accent: #2F80FF;
    }

    @media (prefers-color-scheme: light) {
      #engineering-lab-monogram:not([data-theme="dark"]) {
        --el-ink: #0F172A;
        --el-accent: #2563EB;
      }
    }

    #engineering-lab-monogram[data-theme="dark"] {
      --el-ink: #E8EEF5;
      --el-accent: #2F80FF;
    }

    #engineering-lab-monogram[data-theme="light"] {
      --el-ink: #0F172A;
      --el-accent: #2563EB;
    }

    .letter {
      fill: none;
      stroke-width: 10;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .letter-e {
      stroke: var(--el-ink);
    }

    .letter-l {
      stroke: var(--el-accent);
    }
  </style>

  <!-- E: one vertical spine and three measured horizontal arms. -->
  <path class="letter letter-e" d="
    M 42 42
    V 118
    M 42 42 H 82
    M 42 80 H 72
    M 42 118 H 82
  "/>

  <!-- L: a single right angle, aligned to the E's top and baseline. -->
  <path class="letter letter-l" d="
    M 102 42
    V 118
    H 132
  "/>
</svg>
