<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 240"
  role="img"
  aria-labelledby="engineering-lab-core-title engineering-lab-core-description"
  id="engineering-lab-core-node"
  data-theme="auto">

  <title id="engineering-lab-core-title">Engineering Lab — Core Node</title>
  <desc id="engineering-lab-core-description">
    A minimal network emblem consisting of one central core and six evenly spaced
    circular nodes connected by straight radial lines.
  </desc>

  <style>
    /* A single-colour geometric mark using the established brand accent. */
    #engineering-lab-core-node {
      --el-node: #2F80FF;
    }

    @media (prefers-color-scheme: light) {
      #engineering-lab-core-node:not([data-theme="dark"]) {
        --el-node: #2563EB;
      }
    }

    #engineering-lab-core-node[data-theme="dark"] {
      --el-node: #2F80FF;
    }

    #engineering-lab-core-node[data-theme="light"] {
      --el-node: #2563EB;
    }

    #engineering-lab-core-node[data-variant="inverse"] {
      --el-node: #FFFFFF;
    }

    .connection {
      fill: none;
      stroke: var(--el-node);
      stroke-width: 9;
      stroke-linecap: round;
    }

    .node {
      fill: none;
      stroke: var(--el-node);
      stroke-width: 9;
    }

    .core {
      fill: var(--el-node);
    }
  </style>

  <!-- Six evenly spaced connections radiate from the central core. -->
  <g id="connections" class="connection">
    <path d="M 120 94 V 49"/>
    <path d="M 142.5 107 L 181.5 84.5"/>
    <path d="M 142.5 133 L 181.5 155.5"/>
    <path d="M 120 146 V 191"/>
    <path d="M 97.5 133 L 58.5 155.5"/>
    <path d="M 97.5 107 L 58.5 84.5"/>
  </g>

  <!-- Outer nodes share one size and one consistent stroke. -->
  <g id="outer-nodes" class="node">
    <circle cx="120" cy="38" r="10"/>
    <circle cx="191" cy="79" r="10"/>
    <circle cx="191" cy="161" r="10"/>
    <circle cx="120" cy="202" r="10"/>
    <circle cx="49" cy="161" r="10"/>
    <circle cx="49" cy="79" r="10"/>
  </g>

  <!-- The central core is the only filled element. -->
  <circle class="core" cx="120" cy="120" r="12"/>
</svg>
